<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clients · 10X CRM</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="theme-light">
    <div class="app">
      <!-- SIDEBAR-->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">10X</span>
          <span class="brand-name">10X CRM</span>
        </div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            Dashboard
          </a>
          <a href="clients.html" class="nav-link active">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Clients
          </a>
          <a href="profile.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Profile
          </a>
        </nav>
        <div class="sidebar-foot">
          <a href="index.html" class="nav-link">Log out</a>
        </div>
      </aside>

      <!-- ===== MAIN ===== -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h2 class="topbar-title">Clients</h2>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>
            </button>
            <div class="user-chip">
              <span class="avatar avatar-initials">MT</span>
              <span class="u-name">Mariam Testidze</span>
            </div>
          </div>
        </header>

        <div class="content">
          <!-- page head: title + action buttons -->
          <div class="page-head">
            <div>
              <h1>Clients</h1>
              <p class="sub">Manage your pipeline and relationships</p>
            </div>
            <div class="flex gap-1">
              <button class="btn btn-outline" id="exportBtn">Export CSV</button>
              <button class="btn btn-primary" id="addClientBtn">+ Add Client</button>
            </div>
          </div>

          <!-- toolbar: search + filter chips + sort -->
          <div class="toolbar">
            <div class="search-box">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input
                class="input"
                type="text"
                id="searchInput"
                placeholder="Search by name or company..."
              />
            </div>

            <div class="chips" id="filterChips">
              <button class="chip active" data-status="All">All</button>
              <button class="chip" data-status="Lead">Lead</button>
              <button class="chip" data-status="Contacted">Contacted</button>
              <button class="chip" data-status="Won">Won</button>
              <button class="chip" data-status="Lost">Lost</button>
            </div>

            <select class="input" id="sortSelect" style="width: auto">
              <option value="newest">Newest first</option>
              <option value="name">Name A→Z</option>
              <option value="deal">Deal value: high→low</option>
            </select>
          </div>

          <!-- clients render target (JS fills this) -->
          <div id="clientsArea"></div>
        </div>
      </div>
    </div>

    <!--Add Client modal-->
    <div class="modal-backdrop" id="addModal">
      <div class="modal">
        <div class="modal-head">
          <h3 id="addModalTitle">Add Client</h3>
          <button class="icon-btn" data-close aria-label="Close">&times;</button>
        </div>

        <form id="addForm" novalidate>
          <div class="modal-body">
            <div class="form-grid">
              <div class="field full">
                <label for="cName">Name</label>
                <input class="input" type="text" id="cName" placeholder="Full name" />
                <small class="error-text" id="cNameErr"></small>
              </div>

              <div class="field full">
                <label for="cEmail">Email</label>
                <input class="input" type="text" id="cEmail" placeholder="client@example.com" />
                <small class="error-text" id="cEmailErr"></small>
              </div>

              <div class="field">
                <label for="cPhone">Phone</label>
                <input class="input" type="text" id="cPhone" placeholder="Optional" />
                <small class="error-text" id="cPhoneErr"></small>
              </div>

              <div class="field">
                <label for="cCompany">Company</label>
                <input class="input" type="text" id="cCompany" placeholder="Optional" />
                <small class="error-text" id="cCompanyErr"></small>
              </div>

              <div class="field">
                <label for="cDeal">Deal Value ($)</label>
                <input class="input" type="number" id="cDeal" placeholder="5000" />
                <small class="error-text" id="cDealErr"></small>
              </div>

              <div class="field">
                <label for="cStatus">Status</label>
                <select class="input" id="cStatus">
                  <option value="Lead">Lead</option>
                  <option value="Contacted">Contacted</option>
                  <option value="Won">Won</option>
                  <option value="Lost">Lost</option>
                </select>
              </div>
            </div>
          </div>

          <div class="modal-foot">
            <button type="button" class="btn btn-outline" data-close>Cancel</button>
            <button type="submit" class="btn btn-primary" id="addSubmitBtn">Add Client</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Details modal -->
    <div class="modal-backdrop" id="detailModal">
      <div class="modal modal-lg">
        <div class="modal-head">
          <h3>Client Details</h3>
          <button class="icon-btn" data-close aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="detailBody"><!-- filled by JS --></div>
      </div>
    </div>
  </body>
</html>
