<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile · 10X CRM</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="theme-light">
    <div class="app">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">10X</span>
          <span class="brand-name">10X CRM</span>
        </div>
        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="7" height="9" x="3" y="3" rx="1" />
              <rect width="7" height="5" x="14" y="3" rx="1" />
              <rect width="7" height="9" x="14" y="12" rx="1" />
              <rect width="7" height="5" x="3" y="16" rx="1" />
            </svg>
            Dashboard
          </a>
          <a href="clients.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Clients
          </a>
          <a href="profile.html" class="nav-link active">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Profile
          </a>
        </nav>
        <div class="sidebar-foot">
          <a href="index.html" class="nav-link">
            <svg
              class="nav-ico"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" x2="9" y1="12" y2="12" />
            </svg>
            Log out
          </a>
        </div>
      </aside>

      <!-- MAIN -->
      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <h2 class="topbar-title">Profile</h2>
          </div>
          <div class="topbar-right">
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
                />
              </svg>
            </button>
            <div class="user-chip">
              <span class="avatar avatar-initials">MT</span>
              <span class="u-name">Mariam Testidze</span>
            </div>
          </div>
        </header>

        <div class="content">
          <div class="page-head">
            <div>
              <h1>Profile</h1>
              <p class="sub">Manage your account settings</p>
            </div>
          </div>

          <!-- info block (JS fills avatar/name/email) -->
          <div class="card mb-3">
            <div class="card-body flex items-center gap-2">
              <span
                class="avatar avatar-initials"
                id="pfAvatar"
                style="width: 6.4rem; height: 6.4rem; font-size: 2.2rem"
                >--</span
              >
              <div>
                <h3 id="pfName" style="margin: 0">—</h3>
                <div class="text-muted" id="pfEmail">—</div>
                <div class="text-dim" id="pfMeta" style="font-size: 1.3rem; margin-top: 0.2rem">
                  —
                </div>
              </div>
            </div>
          </div>

          <div class="grid grid-2">
            <!-- edit profile -->
            <div class="card">
              <div class="card-body">
                <h3 class="card-title mb-2">Edit Profile</h3>
                <form id="profileForm" novalidate>
                  <div class="field">
                    <label for="pFullName">Full Name</label>
                    <input class="input" type="text" id="pFullName" />
                    <small class="error-text" id="pFullNameErr"></small>
                  </div>
                  <div class="field">
                    <label for="pCompany">Company</label>
                    <input class="input" type="text" id="pCompany" placeholder="Optional" />
                    <small class="error-text" id="pCompanyErr"></small>
                  </div>
                  <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
              </div>
            </div>

            <!-- change password -->
            <div class="card">
              <div class="card-body">
                <h3 class="card-title mb-2">Change Password</h3>
                <form id="passwordForm" novalidate>
                  <div class="field">
                    <label for="curPass">Current Password</label>
                    <input class="input" type="password" id="curPass" />
                    <small class="error-text" id="curPassErr"></small>
                  </div>
                  <div class="field">
                    <label for="newPass">New Password</label>
                    <input class="input" type="password" id="newPass" />
                    <small class="error-text" id="newPassErr"></small>
                  </div>
                  <div class="field">
                    <label for="confPass">Confirm New Password</label>
                    <input class="input" type="password" id="confPass" />
                    <small class="error-text" id="confPassErr"></small>
                  </div>
                  <button type="submit" class="btn btn-primary">Change Password</button>
                </form>
              </div>
            </div>
          </div>

          <!-- data management -->
          <div class="card mt-3">
            <div class="card-body flex items-center justify-between gap-2" style="flex-wrap: wrap">
              <div>
                <h3 class="card-title">Reset CRM Data</h3>
                <p class="text-muted mb-0" style="font-size: 1.35rem">
                  Reload the original 30 clients from the API. Your account is not affected.
                </p>
              </div>
              <button class="btn btn-danger" id="resetBtn">Reset CRM Data</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- scripts come later -->
  </body>
</html>
